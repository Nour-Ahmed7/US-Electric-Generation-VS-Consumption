<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U.S. Electricity Intelligence Dashboard</title>
<style>:root{--bg:#eef2f7;--card:#fff;--ink:#0f2540;--ink2:#41536b;--mute:#7a8aa0;--line:#e1e8f0;--blue:#1d5fb4;--teal:#14877f;--green:#3f8f4f;--amber:#c98a12;--red:#b84a4a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#e4eaf2;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
#app{position:absolute;left:0;top:0;width:1366px;height:768px;transform-origin:0 0;display:flex;overflow:hidden;
  background:radial-gradient(circle,#d5dfeb 1px,transparent 1.4px) 0 0/22px 22px,var(--bg)}
/* ---- sidebar ---- */
.side{width:196px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 12px;position:relative;z-index:2}
.brand{display:flex;gap:10px;align-items:center;padding:2px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand b{display:block;font-size:14px;line-height:1.15;color:var(--ink);letter-spacing:.1px}
.brand span{display:block;font-size:10.5px;color:var(--mute);margin-top:3px}
#nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-align:left;font-size:12.5px;color:var(--ink2);font-weight:500;width:100%}
.nv svg{width:18px;height:18px;flex:none;opacity:.85}
.nv:hover{background:#f2f6fb}
.nv.on{background:#eaf1fb;color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--blue)}
.nv:focus-visible,.chip:focus-visible,.sel:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.grid-art{margin-top:auto;opacity:.9}
.sidefoot{font-size:10px;color:var(--mute);line-height:1.5;padding:8px 4px 0;border-top:1px solid var(--line)}
/* ---- main ---- */
.main{flex:1;position:relative;min-width:0;overflow:hidden}
.main::before{content:"";position:absolute;left:0;right:0;top:0;height:92px;opacity:.9;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='92' viewBox='0 0 600 92' fill='none'><g stroke='%231d5fb4' stroke-opacity='.10' stroke-width='1.4'><path d='M0 46 C50 6 100 6 150 46 S250 86 300 46 S400 6 450 46 S550 86 600 46'/><path d='M0 62 C50 22 100 22 150 62 S250 102 300 62 S400 22 450 62 S550 102 600 62' stroke='%2314877f'/><path d='M0 30 C50 -10 100 -10 150 30 S250 70 300 30 S400 -10 450 30 S550 70 600 30' stroke='%23c98a12'/></g></svg>") repeat-x}
.top{position:relative;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:1}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.1px}
.top p{font-size:12px;color:var(--ink2);margin-top:2px}
.ctl{display:flex;align-items:center;gap:12px}
.yc{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px}
.yc button{width:22px;height:22px;border-radius:50%;font-size:11px;color:var(--ink2);background:#f2f6fb}
.yc button:hover{background:#e3ecf8}
.yc input{width:150px;accent-color:var(--blue)}
.yc b{font-size:15px;min-width:38px;text-align:center}
.yc span{font-size:11px;color:var(--mute)}
#stateBox{display:flex;align-items:center;gap:6px}
.sel{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;max-width:160px}
#reset{display:none;align-items:center;gap:4px;font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--ink);color:#fff}
.page{position:absolute;left:0;right:0;top:64px;bottom:0;padding:0 16px 14px;display:flex;flex-direction:column;gap:10px;z-index:1}
/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 13px 10px;display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;overflow:hidden}
.card>header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex:none;margin-bottom:6px}
.ct h3{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;line-height:1.25}
.ct p{font-size:11px;color:var(--mute);margin-top:2px;line-height:1.3}
.cc{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.plot{flex:1;min-height:0;min-width:0;position:relative}
.cbody{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.card>footer{flex:none;padding-top:6px;font-size:11px;color:var(--ink2)}
.info{display:inline-flex;width:14px;height:14px;border-radius:50%;background:#e8eff9;color:var(--blue);font-size:9.5px;font-weight:700;align-items:center;justify-content:center;cursor:help;font-style:italic;font-family:Georgia,serif;flex:none}
.warn{margin-left:4px;color:#c98a12;font-size:12px;cursor:help}
.empty{display:flex;height:100%;align-items:center;justify-content:center;color:var(--mute);font-size:12.5px;text-align:center;padding:12px}
/* ---- KPI + strips ---- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;flex:none}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 13px 8px;border-top:3px solid var(--blue)}
.kpi:nth-child(2){border-top-color:var(--teal)}.kpi:nth-child(3){border-top-color:var(--green)}.kpi:nth-child(4){border-top-color:#d9a400}.kpi:nth-child(5){border-top-color:var(--red)}
.kl{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;font-weight:600}
.kv{font-size:27px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin-top:2px}
.kv small{font-size:12px;font-weight:600;color:var(--mute);margin-left:5px;letter-spacing:0}
.kd{font-size:11px;margin-top:1px;min-height:15px}
.up{color:#1d5fb4}.dn{color:#c2602a}.mut{color:var(--mute)}
.strip{display:flex;gap:10px;flex:none}
.strip>div{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:0}
.strip span{font-size:11px;color:var(--ink2);display:block}
.strip b{font-size:16px;font-weight:700}
.strip em{font-size:10.5px;color:var(--mute);font-style:normal;margin-left:6px}
/* ---- controls ---- */
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:11px;padding:3px 10px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--ink2);white-space:nowrap}
.chip:hover{background:#f2f6fb}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lg{display:flex;gap:10px;font-size:11px;color:var(--ink2);flex-wrap:wrap;justify-content:flex-end}
.lgi{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.lgi i{display:inline-block;width:9px;height:9px;border-radius:2px}
/* ---- page grids ---- */
.g1{flex:1;min-height:0;display:grid;grid-template-columns:552px 1fr;grid-template-rows:1.18fr 1fr;gap:10px}
.g1 .c-map{grid-row:1/3}.g1 .c-map .plot{display:flex;flex-direction:column;justify-content:center}
.g2,.g3,.g6{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.g3{grid-template-columns:1.12fr 1fr}
.g4{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:1.02fr 1fr;gap:10px}
.g4 .c-tab{grid-column:span 6}.g4 .c-grp{grid-column:span 6}.g4 .c-his{grid-column:span 5}.g4 .c-pc{grid-column:span 3}.g4 .c-rnk{grid-column:span 4}
.g5{flex:1;min-height:0;display:grid;grid-template-columns:.78fr 1.6fr;grid-template-rows:1.35fr 1fr;gap:10px}
.g5>.card:nth-child(1){grid-column:1;grid-row:1}.g5>.card:nth-child(2){grid-column:1;grid-row:2}
.g5 .c-sc{grid-column:2;grid-row:1}.g5 .c-seg{grid-column:2;grid-row:2}
.g6{grid-template-columns:1.12fr 1fr}
.g7{flex:1;min-height:0;display:grid;grid-template-columns:1.02fr 1.05fr .98fr;gap:10px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}.col>div{display:flex;min-height:0}.col>div>.card{flex:1}
.col .r1{flex:.9}.col .r2{flex:1.1}.col .r3{flex:.82}.col .r4{flex:1.18}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;flex:none}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;border-left:3px solid var(--blue)}
.tile b{font-size:19px;display:block;line-height:1.2}.tile span{font-size:10.5px;color:var(--ink2);line-height:1.25;display:block}
.pick{flex:none;display:flex;align-items:center;gap:14px;font-size:12.5px;font-weight:600;height:30px}
.pick label{display:flex;align-items:center;gap:7px}.pick label i{width:11px;height:11px;border-radius:3px}
.pick span{color:var(--mute);font-weight:400}.pick em{margin-left:auto;font-style:normal;font-size:11px;color:var(--mute);font-weight:400}
/* ---- svg chart styling ---- */
svg{display:block;overflow:visible}
.gl{stroke:#e8eef5;stroke-width:1}.gl.v{stroke-dasharray:2 4}
.ax{font-size:10.5px;fill:#6b7b90}.axt{font-size:11px;fill:var(--ink2)}
.el{font-size:11px;fill:var(--ink);font-weight:600}.nt{font-size:10px;font-weight:600}
.mk{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3;opacity:.7}
.hv .xh,.hv .xd{opacity:0;pointer-events:none}.hv:hover .xh,.hv:hover .xd{opacity:1}.xh{stroke:#9fb1c8;stroke-width:1}
.hit{fill:transparent}
.row{cursor:pointer}.rowbg{fill:transparent}.row:hover .rowbg{fill:#f3f7fc}
.bl{font-size:12px;fill:var(--ink2);font-weight:500}.bl.on{fill:var(--ink);font-weight:700}
.bv{font-size:12px;fill:var(--ink);font-weight:600}.bs{font-size:10.5px;fill:var(--mute);font-weight:400}
.pl{font-size:10.5px;fill:var(--ink);font-weight:600;pointer-events:none}
.qd{font-size:10px;fill:#9aa8ba;font-style:italic}
.med{stroke:#b9c6d6;stroke-dasharray:4 4}
.pt,.st{cursor:pointer}.st:hover{opacity:.8}
.mapsvg{width:100%;height:100%;max-height:100%}
.s1{overflow:visible}
.stk{display:flex;flex-direction:column;height:100%}.mt{font-size:10.5px;font-weight:600;color:var(--ink2);padding:2px 0 0 4px;flex:none}
.split{display:flex;height:100%}.split>svg,.split>.empty{flex:none}
.mini{flex:1;min-width:0;border-left:1px solid var(--line);margin-left:6px;padding:0 0 0 12px;display:flex;flex-direction:column}
.mini h4{font-size:10.5px;font-weight:700;color:var(--ink2);margin:3px 0 4px}.mini h4:nth-of-type(2){margin-top:9px}
.mini p{font-size:10px;color:var(--mute);margin-top:auto}
.mr{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 4px;border-radius:5px;cursor:pointer}
.mr:hover{background:#f3f7fc}.mr.on{background:#e8eff9}.mr span{width:14px;color:var(--mute);font-size:10.5px}.mr b{width:24px}.mr em{margin-left:auto;font-style:normal;font-weight:600}
.maplg{position:absolute;right:6px;bottom:30px;font-size:10px;color:var(--ink2);display:flex;align-items:center;gap:5px}.maplg i{width:12px;height:10px;border:1.6px solid var(--amber);border-radius:2px;display:inline-block}
.lg-ramp{position:absolute;left:10px;bottom:6px;display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink2)}
.lg-ramp i{width:150px;height:9px;border-radius:5px;display:block}.lg-ramp em{font-style:normal;color:var(--mute)}
.c-map .plot{overflow:hidden}
/* ---- tables ---- */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:11px;color:var(--ink2);font-weight:600;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:4px 6px;text-align:right;border-bottom:1px solid #f0f4f8;font-weight:500}
.tbl td:first-child{font-weight:600}.tbl td small{font-size:10px;color:var(--mute);font-weight:400;margin-left:3px}
.tbl .a{color:#1a64be;font-weight:700}.tbl .b{color:#c46a1b;font-weight:700}
.tbl.sm{font-size:11.5px}.tbl.sm td{padding:3px 6px}.tbl.sm th{padding:3px 6px}
.bd{font-size:10px;padding:1px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
.bd.ok{background:#e3f3e7;color:#2b6d3a}.bd.na{background:#eceff4;color:#4d5d73}.bd.un{background:#fbeccd;color:#7a5600}.bd.pa{background:#fbe2da;color:#8b3a1b}
.zx{margin-top:8px}.zx h4{font-size:11px;color:var(--ink2);margin-bottom:5px}
.zb{display:flex;height:11px;border-radius:6px;overflow:hidden;gap:1px;margin-bottom:6px;background:#eee}
.lg.wrap{justify-content:flex-start;gap:4px 12px}
.note{font-size:11px;color:var(--ink2);line-height:1.4;margin:5px 0}
.af-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px 6px;margin-top:6px}
.af-stats div{background:#f7f9fc;border-radius:7px;padding:5px 8px}.af-stats span{font-size:10.5px;color:var(--ink2);display:block}.af-stats b{font-size:11.5px;display:block}.af-stats em{font-style:normal;font-size:11px;color:var(--mute)}
.af-stats .wide{grid-column:1/4}
.meth h4{font-size:11.5px;margin:5px 0 1px}.meth h4:first-child{margin-top:0}.meth p{font-size:10.8px;line-height:1.38;color:var(--ink2)}
.cp{display:inline-block}
/* dumbbell comparison */
.cmp{display:flex;flex-direction:column;height:100%}
.ch,.cr{display:grid;grid-template-columns:88px 1fr 60px 56px 64px;align-items:center;gap:4px}
.ch{font-size:10.5px;color:var(--mute);height:18px}.ch .cx{display:flex;justify-content:space-between;height:auto}.ch .cx i{font-style:normal}
.ch>span:nth-child(n+3),.cr>span:nth-child(n+3){text-align:right}
.cr{flex:1;border-top:1px solid #f0f4f8;font-size:12px;font-weight:600}
.cn{display:flex;align-items:center;gap:6px;font-weight:600}.cn i{width:9px;height:9px;border-radius:2px}
.cx{position:relative;height:100%}.cx u{position:absolute;left:0;right:0;top:50%;border-top:1px solid #e3eaf2}
.cx s{position:absolute;top:50%;height:3px;margin-top:-1.5px;background:#c9d6e6;border-radius:2px}
.cx b{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;border:2px solid #9fb1c8;background:#fff}
.cx b.d1{background:#9fb1c8}
.cf{display:flex;gap:14px;align-items:center;font-size:10.5px;color:var(--ink2);padding-top:4px}.cf b{position:static;display:inline-block;margin:0 4px 0 0;vertical-align:-2px;width:10px;height:10px;border-radius:50%;border:2px solid #9fb1c8;background:#fff}.cf b.d1{background:#9fb1c8}.cf em{margin-left:auto;font-style:normal;color:var(--mute)}
/* segments */
.segs{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;flex:1;min-height:0}
.sg{background:#f7f9fc;border-radius:8px;padding:6px 9px;overflow:hidden}
.sg h4{font-size:11.5px;display:flex;justify-content:space-between;margin-bottom:3px}.sg h4 b{color:var(--blue)}
.cl{display:flex;flex-wrap:wrap;gap:3px}
.cp{font-size:10.5px;padding:1px 6px;border-radius:5px;background:#e2ebf8;color:#17407a;cursor:pointer;font-weight:600}
.cp.af{background:#fbf0cf;color:#7a5600}.cp.on{background:var(--ink);color:#fff}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}.stats b{color:var(--ink);font-size:13px}.stats em{font-style:normal;color:var(--mute)}
.cav{display:block;font-size:10.5px;color:var(--mute);margin-top:2px}
/* ---- tooltip ---- */
#tip{position:absolute;display:none;z-index:99;background:#0f2540;color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;pointer-events:none;max-width:270px;line-height:1.45;box-shadow:0 6px 18px rgba(15,37,64,.28)}
#tip b{font-weight:700}
.tr{display:flex;gap:7px;align-items:center;justify-content:space-between;white-space:nowrap}
.tr b{margin-left:auto;padding-left:12px}.tr i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.tr.tt{border-top:1px solid rgba(255,255,255,.2);margin-top:2px;padding-top:2px}
#tip .warnr{color:#ffd37a;white-space:normal}#tip .mut{color:#9fb1c8}
@media (prefers-reduced-motion:no-preference){.nv,.chip,.st{transition:background .12s,opacity .12s}}

.rb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}

.c-tab .tbl td{padding:8px 6px}
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2540"/><stop offset="1" stop-color="#1d5fb4"/></linearGradient></defs>
        <rect width="40" height="40" rx="10" fill="url(#lg1)"/>
        <path d="M22.5 6 L11 22.5 H19 L16.5 34 L29 16.5 H21 Z" fill="#fff"/>
        <path d="M3 31 C8 25 12 25 15 31 S23 37 27 31 S33 25 37 31" fill="none" stroke="#3fd0c4" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div><b>U.S. Electricity<br>Intelligence</b><span>States · 2000–2025</span></div>
    </div>
    <nav id="nav" aria-label="Dashboard pages"></nav>
    <svg class="grid-art" width="176" height="150" viewBox="0 0 176 150" fill="none" aria-hidden="true">
      <g stroke="#1d5fb4" stroke-opacity=".28" stroke-width="1.3" stroke-linecap="round">
        <path d="M30 140 L44 40 L58 140 M36 100 H52 M33 120 H55 M40 62 H48 M44 40 V28"/>
        <path d="M118 140 L132 54 L146 140 M124 104 H140 M121 122 H143 M128 74 H136 M132 54 V44"/>
        <path d="M44 32 C70 46 100 46 132 48" stroke="#14877f" stroke-opacity=".5"/>
        <path d="M44 40 C70 56 100 56 132 54" stroke="#14877f" stroke-opacity=".5"/>
        <path d="M0 140 H176" stroke-opacity=".18"/>
      </g>
    </svg>
    <div class="sidefoot">Data: EIA · Ember · BEA · FRED<br>Prices: 2025 $ (CPI-U) or nominal.</div>
  </aside>
  <div class="main">
    <div class="top">
      <div><h1 id="title"></h1><p id="sub"></p></div>
      <div class="ctl">
        <div id="realBox" class="rb" title="Deflate electricity prices with CPI-U (BLS); GDP per capita switches to BEA real 2017 dollars"><span>Dollars</span><div class="chips"><button class="chip" data-set="real" data-v="false">Nominal</button><button class="chip" data-set="real" data-v="true">Real · 2025 $</button></div></div>
        <div id="stateBox"><select id="stateSel" class="sel" aria-label="Selected state"></select><button id="reset">✕ All states</button></div>
        <div class="yc"><span>Year</span><button data-yr="-1" aria-label="Previous year">◀</button><input id="yrng" type="range" min="2000" max="2025" step="1" aria-label="Year"><button data-yr="1" aria-label="Next year">▶</button><b id="yr"></b></div>
      </div>
    </div>
    <div id="page" class="page"></div>
  </div>

    if(o.endLabels && last>=0) ends.push({y:Y(s.vals[last])+3.5,x:X(last),name:s.short||s.name,color:s.color});
  });
  if(o.endLabels){ spread(ends,12,pad.t+6,pad.t+ih).forEach(l=>{ g+=`<text class="el" x="${l.x+6}" y="${l.y}" >${esc(l.name)}</text><circle cx="${l.x}" cy="${l.y-3.5}" r="0"/>`; }); }
  if(o.marker){ const i=o.marker-Y0; g+=`<line class="mk" x1="${X(i)}" x2="${X(i)}" y1="${pad.t}" y2="${pad.t+ih}"/>`; o.series.forEach(s=>{ if(nn(s.vals[i])) g+=`<circle cx="${X(i)}" cy="${Y(s.vals[i])}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`; }); }
  for(let i=0;i<NY;i++){
    const tip = o.tip ? o.tip(i) : `<b>${YEARS[i]}</b>`+o.series.map(s=>`<div class="tr"><i style="background:${s.color}"></i>${esc(s.name)}<b>${nn(s.vals[i])?(o.tipFmt||tf)(s.vals[i]):'—'}</b></div>`).join('');
    let dots=''; o.series.forEach(s=>{ if(nn(s.vals[i])) dots+=`<circle class="xd" cx="${X(i)}" cy="${Y(s.vals[i])}" r="3.5" fill="${s.color}" stroke="#fff" stroke-width="1.5"/>`; });
    g+=`<g class="hv"><rect class="hit" x="${X(i)-step/2}" y="${pad.t}" width="${step}" height="${ih}" data-tip="${esc(tip)}"/><line class="xh" x1="${X(i)}" x2="${X(i)}" y1="${pad.t}" y2="${pad.t+ih}"/>${dots}</g>`;
  }
  return svgWrap(w,h,g);
}

/* ---------- stacked area (absolute or 100 %) ---------- */
function stackChart(w,h,o){
  const pad=Object.assign({l:48,r:14,t:12,b:24},o.pad||{});
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b, X=i=>pad.l+i*iw/(NY-1), step=iw/(NY-1);
  const S_=o.series;
  const tot = YEARS.map((_,i)=>{ const v=S_.map(s=>s.vals[i]); return v.every(x=>!nn(x)) ? null : v.reduce((a,x)=>a+(nn(x)?Math.max(0,x):0),0); });
  const valid = tot.map(t=>t!==null);
  if(!valid.some(Boolean)) return empty(o.emptyMsg||'No data for this selection');
  let hi = o.pct ? 100 : Math.max(...tot.filter(nn));
  const tk=niceTicks(0,hi,o.ticks||4); hi=tk[tk.length-1]; const tf=o.pct?(v=>v+'%'):tickFmt(tk);
  const Y=v=>pad.t+ih-v/hi*ih;
  let g='';
  tk.forEach(t=>{ g+=`<line class="gl" x1="${pad.l}" x2="${w-pad.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pad.l-6}" y="${Y(t)+3.5}" text-anchor="end">${tf(t)}</text>`; });
  g+=xAxisYears(X,pad.t+ih,h,pad);
  const first=valid.indexOf(true), lastI=valid.lastIndexOf(true);
  const base=YEARS.map(()=>0), tops=[];
  S_.forEach((s,k)=>{
    const top=YEARS.map((_,i)=>{ if(!valid[i]) return null; const v=nn(s.vals[i])?Math.max(0,s.vals[i]):0; const val=o.pct?v/tot[i]*100:v; return base[i]+val; });
    let d='M'+X(first)+' '+Y(base[first]);
    for(let i=first;i<=lastI;i++) d+=`L${X(i).toFixed(1)} ${Y(top[i]).toFixed(1)}`;
    for(let i=lastI;i>=first;i--) d+=`L${X(i).toFixed(1)} ${Y(base[i]).toFixed(1)}`;
    g+=`<path d="${d}Z" fill="${s.color}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>`;
    for(let i=first;i<=lastI;i++) base[i]=top[i];
  });
  if(first>0){ const gx=X(0), gw=X(first)-X(0); g+=`<rect x="${gx}" y="${pad.t}" width="${gw}" height="${ih}" fill="#f1f4f8"/><text class="nt" transform="translate(${gx+gw/2+3.5} ${pad.t+ih/2}) rotate(-90)" text-anchor="middle" fill="${COL.mute}" style="font-weight:500">${esc(o.gapNote||'No data')}</text>`; }
  if(o.marker && valid[o.marker-Y0]){ const i=o.marker-Y0; g+=`<line class="mk" x1="${X(i)}" x2="${X(i)}" y1="${pad.t}" y2="${pad.t+ih}"/>`; }
  for(let i=0;i<NY;i++){
    if(!valid[i]) continue;
    const rows=S_.slice().reverse().map(s=>{ const v=nn(s.vals[i])?Math.max(0,s.vals[i]):0; return `<div class="tr"><i style="background:${s.color}"></i>${esc(s.name)}<b>${o.pct?fnum(v/tot[i]*100,1)+'%':fnum(v,o.dec||0)+' '+(o.unit||'')}</b></div>`; }).join('');
    g+=`<g class="hv"><rect class="hit" x="${X(i)-step/2}" y="${pad.t}" width="${step}" height="${ih}" data-tip="${esc(`<b>${YEARS[i]}</b>${rows}<div class='tr tt'>Total<b>${o.pct?'100%':fnum(tot[i],o.dec||0)+' '+(o.unit||'')}</b></div>`)}"/><line class="xh" x1="${X(i)}" x2="${X(i)}" y1="${pad.t}" y2="${pad.t+ih}"/></g>`;
  }
  return svgWrap(w,h,g);
}

/* ---------- horizontal bars ---------- */
function barsH(w,h,o){
  const it=o.items; if(!it.length) return empty(o.emptyMsg||'No data for this selection');
  const lw=o.lw||40, rw=o.rw||96, rh=Math.min(o.maxRow||32,h/it.length), bh=Math.min(o.maxBar||17,rh*.58);
  const vmax=o.max||Math.max(...it.map(i=>Math.abs(i.value))), x0=lw+8, iw=w-x0-rw;
  let g='';
  it.forEach((d,i)=>{
    const y=i*rh+rh/2, bw=Math.max(2,Math.abs(d.value)/vmax*iw);
    const tip=d.tip?` data-tip="${esc(d.tip)}"`:'';
    g+=`<g class="row${d.sel?' act':''}"${d.c?` data-sel="${d.c}"`:''}${tip}><rect class="rowbg" x="0" y="${i*rh}" width="${w}" height="${rh}"/>`+
       `<text class="bl${d.on?' on':''}" x="${lw}" y="${y+4}" text-anchor="end">${esc(d.label)}</text>`+
       `<rect x="${x0}" y="${y-bh/2}" width="${bw}" height="${bh}" rx="3" fill="${d.color}"${d.faded?' opacity=".45"':''}/>`+
       (d.stack||'')+
       `<text class="bv" x="${x0+bw+6}" y="${y+4}">${esc(d.text)}${d.sub?`<tspan class="bs" dx="5">${esc(d.sub)}</tspan>`:''}</text></g>`;
  });
  return svgWrap(w,h,g);
}

/* stacked horizontal bars: items[{label,parts:[{v,color,name}],text}] */
function barsStackH(w,h,o){
  const it=o.items; if(!it.length) return empty('No data for this selection');
  const lw=o.lw||40, rw=o.rw||70, rh=Math.min(o.maxRow||32,h/it.length), bh=Math.min(17,rh*.58);
  const vmax=Math.max(...it.map(i=>i.total)), x0=lw+8, iw=w-x0-rw;
  let g='';
  it.forEach((d,i)=>{
    const y=i*rh+rh/2; let x=x0;
    g+=`<g class="row${d.sel?' act':''}" data-sel="${d.c}" data-tip="${esc(d.tip||'')}"><rect class="rowbg" x="0" y="${i*rh}" width="${w}" height="${rh}"/><text class="bl${d.on?' on':''}" x="${lw}" y="${y+4}" text-anchor="end">${esc(d.label)}</text>`;
    d.parts.forEach(p=>{ const pw=Math.max(0,p.v)/vmax*iw; if(pw>0){ g+=`<rect x="${x.toFixed(1)}" y="${y-bh/2}" width="${Math.max(pw-1,0.5).toFixed(1)}" height="${bh}" fill="${p.color}"/>`; x+=pw; } });
    g+=`<text class="bv" x="${x+6}" y="${y+4}">${esc(d.text)}</text></g>`;
  });
  return svgWrap(w,h,g);
}

/* ---------- scatter with optional regression / median guides ---------- */
function scatterChart(w,h,o){
  const pad=Object.assign({l:50,r:16,t:14,b:36},o.pad||{});
  const pts=o.points.filter(p=>nn(p.x)&&nn(p.y)); if(pts.length<2) return empty('Not enough observations');
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const xt=niceTicks(Math.min(...pts.map(p=>p.x))*(o.xZero?0:1), Math.max(...pts.map(p=>p.x)),5), yt=niceTicks(Math.min(0,...pts.map(p=>p.y)), Math.max(...pts.map(p=>p.y)),4);
  const xl=xt[0], xh=xt[xt.length-1], yl=yt[0], yh=yt[yt.length-1];
  const X=v=>pad.l+(v-xl)/(xh-xl)*iw, Y=v=>pad.t+ih-(v-yl)/(yh-yl)*ih;
  const xf=o.xFmt||tickFmt(xt), yf=o.yFmt||tickFmt(yt);
  let g='';
  yt.forEach(t=>{ g+=`<line class="gl" x1="${pad.l}" x2="${w-pad.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pad.l-6}" y="${Y(t)+3.5}" text-anchor="end">${yf(t)}</text>`; });
  xt.forEach(t=>{ g+=`<line class="gl v" x1="${X(t)}" x2="${X(t)}" y1="${pad.t}" y2="${pad.t+ih}"/><text class="ax" x="${X(t)}" y="${pad.t+ih+14}" text-anchor="middle">${xf(t)}</text>`; });
  g+=`<text class="axt" x="${pad.l+iw/2}" y="${h-4}" text-anchor="middle">${esc(o.xLabel)}</text><text class="axt" transform="translate(12 ${pad.t+ih/2}) rotate(-90)" text-anchor="middle">${esc(o.yLabel)}</text>`;
  if(o.medX!==undefined){ g+=`<line class="med" x1="${X(o.medX)}" x2="${X(o.medX)}" y1="${pad.t}" y2="${pad.t+ih}"/><line class="med" x1="${pad.l}" x2="${w-pad.r}" y1="${Y(o.medY)}" y2="${Y(o.medY)}"/>`; }
  if(o.reg){ const x1=xl,x2=xh; g+=`<line x1="${X(x1)}" y1="${Y(o.reg.a+o.reg.b*x1)}" x2="${X(x2)}" y2="${Y(o.reg.a+o.reg.b*x2)}" stroke="${COL.ink}" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/>`; }
  const sorted=pts.slice().sort((a,b)=>(a.sel?1:0)-(b.sel?1:0));
  sorted.forEach(p=>{ g+=`<g class="pt${p.sel?' act':''}" data-sel="${p.c}" data-tip="${esc(p.tip)}"><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.sel?7:(p.r||5)}" fill="${p.color}" fill-opacity="${p.sel?1:.82}" stroke="${p.sel?COL.ink:'#fff'}" stroke-width="${p.sel?2.5:1.4}"/></g>`; });
  (o.labels||[]).forEach(c=>{ const p=pts.find(q=>q.c===c); if(p) g+=`<text class="pl" x="${X(p.x)+8}" y="${Y(p.y)+3}">${c}</text>`; });
  if(o.quad){ g+=o.quad.map(q=>`<text class="qd" x="${q.right?w-pad.r-4:pad.l+4}" y="${q.bottom?pad.t+ih-6:pad.t+11}" text-anchor="${q.right?'end':'start'}">${esc(q.t)}</text>`).join(''); }
  return svgWrap(w,h,g);
}

/* ---------- choropleth (real U.S. state geometry, Albers projection) ---------- */
const RAMPS = {
  gen:  ['#e8f0fb','#6fa3e0','#0f3a78'],
  sales:['#e1f4f2','#58bdb7','#0b5552'],
  ren:  ['#e9f4e6','#7fbf6c','#1f5a22'],
  emis: ['#fbeaea','#e0827c','#7d1f24']
};
function hex2rgb(h){ return [1,3,5].map(i=>parseInt(h.substr(i,2),16)); }
function rampColor(stops,t){ t=clamp(t,0,1); const n=stops.length-1, k=Math.min(n-1,Math.floor(t*n)), f=t*n-k, a=hex2rgb(stops[k]), b=hex2rgb(stops[k+1]); return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*f)).join(',')+')'; }
function mapChart(w,h,o){
  const paths=P.map.paths, cent=P.map.centroids;
  const vals=Object.values(o.values).filter(nn); const mn=Math.min(...vals), mx=Math.max(...vals);
  const tt = v => o.linear ? (v-mn)/(mx-mn||1) : Math.sqrt((v-mn)/(mx-mn||1));
  const ramp=RAMPS[o.ramp];
  let g='';
  C.forEach(c=>{
    if(!paths[c]) return;
    const v=o.values[c], fill = nn(v) ? rampColor(ramp,tt(v)) : '#e6eaf0';
    const sel=S.sel===c, brk = o.flagAff && AFF[c];
    const stroke = sel ? COL.ink : brk ? COL.amber : '#fff';
    g+=`<path class="st${sel?' act':''}" data-sel="${c}" d="${paths[c]}" fill="${fill}" stroke="${stroke}" stroke-width="${sel?2.6:brk?1.6:.8}" data-tip="${esc(o.tip(c))}"/>`;
  });
  if(S.sel && paths[S.sel]) g+=`<path d="${paths[S.sel]}" fill="none" stroke="${COL.ink}" stroke-width="2.6" pointer-events="none"/>`;
  // DC callout (too small to click at map scale)
  const dc=cent['DC']; if(dc){ const cx=dc[0]+34, cy=dc[1]+22, sel=S.sel==='DC';
    g+=`<line x1="${dc[0]}" y1="${dc[1]}" x2="${cx}" y2="${cy}" stroke="#9aa8ba" stroke-width="1"/><g class="st${sel?' act':''}" data-sel="DC" data-tip="${esc(o.tip('DC'))}"><circle cx="${cx}" cy="${cy}" r="9" fill="${nn(o.values.DC)?rampColor(ramp,tt(o.values.DC)):'#e6eaf0'}" stroke="${sel?COL.ink:'#fff'}" stroke-width="${sel?2.6:1.2}"/><text class="pl" x="${cx}" y="${cy+3}" text-anchor="middle" style="font-size:8px">DC</text></g>`; }
  return `<svg class="mapsvg" viewBox="0 0 975 610" preserveAspectRatio="xMidYMid meet" role="img">${g}</svg>`;
}
const mapLegend = (o) => { const vals=Object.values(o.values).filter(nn); const mn=Math.min(...vals), mx=Math.max(...vals); const st=RAMPS[o.ramp];
  return `<div class="lg-ramp"><span>${o.fmt(mn)}</span><i style="background:linear-gradient(90deg,${st[0]},${st[1]},${st[2]})"></i><span>${o.fmt(mx)}</span><em>${o.linear?'linear':'√ scale'}</em></div>`; };
const CH = { line:lineChart, stack:stackChart, bars:barsH, barsStack:barsStackH, scatter:scatterChart, map:mapChart };
window.__CH = CH;
/* ==== part 2 follows ==== */
/* =====================================================================
   Part 2: shared UI helpers + pages 1-3
   ===================================================================== */
const chip = (key,opts,cur) => `<div class="chips">${opts.map(o=>`<button class="chip${String(cur)===String(o.v)?' on':''}" data-set="${key}" data-v="${o.v}">${o.l}</button>`).join('')}</div>`;
const leg = items => `<div class="lg">${items.map(i=>`<span class="lgi"><i style="background:${i.color}${i.dash?';height:0;border-top:2px dashed '+i.color:''}"></i>${esc(i.name)}</span>`).join('')}</div>`;
const info = t => `<span class="info" data-tip="${esc(t)}">i</span>`;
function card(o){
  return `<section class="card ${o.cls||''}" style="${o.style||''}"><header><div class="ct"><h3>${o.title}${o.info?info(o.info):''}</h3>${o.sub?`<p>${o.sub}</p>`:''}</div><div class="cc">${o.ctrl||''}</div></header>${o.body!==undefined?`<div class="cbody">${o.body}</div>`:`<div class="plot" data-draw="${o.id}"></div>`}${o.foot?`<footer>${o.foot}</footer>`:''}</section>`;
}
function kpi(label,val,unit,delta,infoTxt,warn){
  return `<div class="kpi"><div class="kl">${label}${infoTxt?info(infoTxt):''}${warn?`<span class="warn" data-tip="${esc(warn)}">⚠</span>`:''}</div><div class="kv">${val}<small>${unit}</small></div><div class="kd">${delta}</div></div>`;
}
const deltaTxt = (cur,prev,kind='pct',label) => {
  if(!nn(cur)||!nn(prev)) return '<span class="mut">no prior-year value</span>';
  const d = kind==='pp' ? cur-prev : pctChg(cur,prev); if(!nn(d)) return '<span class="mut">—</span>';
  const arrow = d>0.0005?'▲':d<-0.0005?'▼':'■';
  return `<span class="${d>0?'up':d<0?'dn':''}">${arrow} ${fnum(Math.abs(d),kind==='pp'?2:1)}${kind==='pp'?' pp':'%'}</span> <span class="mut">vs ${label}</span>`;
};
const noGen = () => S.year<2001 ? `Generation and emissions data start in 2001 — select 2001 or later.` : null;
const trendSub = () => (S.sel?nm(S.sel):'All 50 states + DC');
const yearNote = { year:S.year };

/* ---------------------------------------------------------------- PAGE 1 */
const MAPM = {
  gen:  {l:'Generation',  ramp:'gen',  fn:d=>d.gen,  fmt:v=>fnum(v,v<10?1:0)+' TWh', short:'TWh'},
  sales:{l:'Sales',       ramp:'sales',fn:d=>d.sales,fmt:v=>fnum(v,v<10?1:0)+' TWh', short:'TWh'},
  ren:  {l:'Renewable share',ramp:'ren',fn:d=>d.renS,fmt:v=>fnum(v,1)+'%',linear:true,short:'%'},
  emis: {l:'Emissions',   ramp:'emis', fn:d=>d.emis, fmt:v=>fnum(v,v<10?1:0)+' MtCO₂e', short:'MtCO₂e'}
};
function pOverview(D){
  const L=scopeList(), a=agg(L,S.year), b=S.year>Y0?agg(L,S.year-1):null, py=S.year-1;
  const salesWarn = (S.year>=2010 && (!S.sel || AFF[S.sel])) ? 'Reported retail sales drop sharply from 2010 in 14 states (reporting discontinuity, see Methodology). Sales trends in this view are affected.' : '';
  const kp = [
    kpi('Electricity generation',fnum(a.gen,0),'TWh',nn(a.gen)?deltaTxt(a.gen,b&&b.gen,'pct',py):'<span class="mut">data start in 2001</span>','Sum of the nine source columns for each state-year (blank = not reported, never imputed as an estimate). Excludes the US aggregate row.'),
    kpi('Electricity sales',fnum(a.sales,0),'TWh',deltaTxt(a.sales,b&&b.sales,'pct',py),'Retail sales in MWh divided by 1,000,000. Sales ≠ generation: losses, own use and trade sit between them.',salesWarn),
    kpi('Renewable share',nn(a.renS)?fnum(a.renS,1):'—','%',nn(a.renS)?deltaTxt(a.renS,b&&b.renS,'pp',py):'<span class="mut">data start in 2001</span>','Hydro + Wind + Solar + Bioenergy + Other renewables, divided by total generation × 100. Nuclear is low-carbon but not renewable.'),
    kpi('Avg retail price',fnum(money(a.price,S.year),2),S.real?'¢/kWh · 2025 $':'¢/kWh · nominal',deltaTxt(money(a.price,S.year),b&&money(b.price,S.year-1),'pct',py),'Sales-weighted: total revenue ÷ total sales × 100 (not a simple average of state prices). '+(S.real?'Deflated to 2025 dollars with CPI-U (BLS), so changes are real price changes. Switch to Nominal in the top bar.':'Nominal dollars: part of any rise is general inflation.')),
    kpi('Power-sector emissions',nn(a.emis)?fnum(a.emis,0):'—','MtCO₂e',nn(a.emis)?deltaTxt(a.emis,b&&b.emis,'pct',py):'<span class="mut">data start in 2001</span>','Greenhouse gases in CO₂-equivalent from electricity generation (Ember). Not a measure of every air pollutant.')
  ].join('');
  const mm=MAPM[S.mapMetric];
  D.map=(w,h)=>{
    if(S.mapMetric!=='sales' && noGen()) return empty(noGen());
    const values={}; C.forEach(c=>{ const v=mm.fn(dv(c,S.year)); if(nn(v)) values[c]=v; });
    const tip = c => { const d=dv(c,S.year), v=mm.fn(d); const rk=rankMap(C.map(x=>({c:x,v:mm.fn(dv(x,S.year))})))[c];
      return `<b>${nm(c)}</b><div class="tr">${mm.l} ${S.year}<b>${nn(v)?mm.fmt(v):'no data'}</b></div>${rk?`<div class="tr">Rank<b>#${rk} of ${Object.keys(values).length}</b></div>`:''}${S.mapMetric==='sales'&&AFF[c]?`<div class="tr warnr">⚠ reporting break: 2025/2009 sales = ${fnum(RATIO[c],2)}</div>`:''}<div class="tr mut">Click to select</div>`; };
    const o={values,ramp:mm.ramp,linear:mm.linear,tip,flagAff:S.mapMetric==='sales',fmt:mm.fmt};
    return mapChart(w,h,o)+mapLegend(o)+(S.mapMetric==='sales'?`<div class="maplg"><i></i> amber outline = sales reporting break (14 areas)</div>`:'');
  };
  D.rank=(w,h)=>{
    if(S.rankMetric==='gen' && noGen()) return empty(noGen());
    const isG=S.rankMetric==='gen', y=S.year, f=isG?d=>d.gen:d=>d.sales;
    const pcF=isG?d=>(d.pop&&nn(d.gen))?d.gen*1e6/d.pop:null:d=>d.spc;
    const pcR=rankMap(C.map(c=>({c,v:pcF(dv(c,y))})));
    const arr=C.map(c=>({c,v:f(dv(c,y))})).filter(i=>nn(i.v)).sort((a,b)=>b.v-a.v);
    const tot=arr.reduce((s,i)=>s+i.v,0);
    const mk=(i,rank)=>{ const c=i.c, sel=S.sel===c, brk=!isG&&AFF[c];
      return {c,label:c,on:sel,sel,value:i.v,color:sel?COL.ink:brk?'#d9a400':isG?'#2a78d6':'#14877f',text:fnum(i.v,0)+' TWh',sub:pcR[c]?`#${pcR[c]} per capita`:'no pop. data',
        tip:`<b>${nm(c)}</b><div class="tr">${isG?'Generation':'Sales'} ${y}<b>${fnum(i.v,1)} TWh</b></div><div class="tr">Share of total<b>${fnum(i.v/tot*100,1)}%</b></div><div class="tr">Size rank<b>#${rank}</b></div><div class="tr">Per-capita rank<b>${pcR[c]?'#'+pcR[c]:'n/a'}</b></div>${brk?'<div class="tr warnr">⚠ understated by reporting break</div>':''}`}; };
    const items=arr.slice(0,10).map((i,k)=>mk(i,k+1));
    if(S.sel && !items.some(i=>i.c===S.sel)){ const k=arr.findIndex(i=>i.c===S.sel); if(k>=0) items.push(mk(arr[k],k+1)); }
    return barsH(w,h,{items,lw:34,rw:150,maxRow:27,maxBar:15});
  };
  D.trend=(w,h)=>{
    const L2 = (!S.sel && S.basis==='unaff') ? UNAFF_LIST : L;
    const gen=series(L2,x=>x.gen), sal=series(L2,x=>x.sales);
    return lineChart(w,h,{series:[{name:'Generation',color:'#2a78d6',vals:gen},{name:'Sales',color:'#14877f',vals:sal}],endLabels:true,marker:S.year,pad:{r:62},
      notes:(!S.sel&&S.basis==='all')?[{year:2010,text:'sales reporting break'}]:[], yFmt:v=>fnum(v,0),
      tipFmt:v=>fnum(v,0)+' TWh', tip:i=>{ const g=gen[i],s=sal[i]; return `<b>${YEARS[i]}</b><div class="tr"><i style="background:#2a78d6"></i>Generation<b>${nn(g)?fnum(g,0)+' TWh':'no data'}</b></div><div class="tr"><i style="background:#14877f"></i>Sales<b>${fnum(s,0)} TWh</b></div><div class="tr">Sales ÷ generation<b>${nn(g)&&nn(s)?fnum(s/g*100,1)+'%':'—'}</b></div><div class="tr tt">Generation − sales<b>${nn(g)&&nn(s)?fnum(g-s,0)+' TWh':'—'}</b></div>`; }});
  };
  const html = `<div class="kpis">${kp}</div>
  <div class="g1">
    ${card({cls:'c-map',title:`Where electricity is made and used`,sub:`${mm.l}, ${S.year} · click a state to focus the dashboard`,
      info:'Each state is coloured by the selected metric for the selected year (√ colour scale so that large states do not wash out the rest). Click a state to filter KPIs, rankings and trends; click it again or use “All states” to return.',
      ctrl:chip('mapMetric',Object.keys(MAPM).map(k=>({v:k,l:MAPM[k].l})),S.mapMetric),id:'map'})}
    ${card({cls:'c-rank',title:`Top 10 states by ${S.rankMetric==='gen'?'generation':'sales'}`,sub:'Bars = total size · right label = rank on a per-capita basis',
      info:'Ranking of the 51 areas for the selected year. The per-capita rank (value ÷ population, 50 states with population data) shows whether a large state is also an intensive producer or user. Amber bars: sales understated by the 2010 reporting break.',
      ctrl:chip('rankMetric',[{v:'gen',l:'Generation'},{v:'sales',l:'Sales'}],S.rankMetric),id:'rank'})}
    ${card({cls:'c-trend',title:'Generation vs. sales, 2000–2025',sub:`${S.sel?nm(S.sel):(S.basis==='unaff'?'37 states without the reporting break':'All 50 states + DC')} · TWh · marker = selected year`,
      info:'Two different quantities: generation (supply) and retail sales (demand). 2000 has no generation data and is left blank, not zero. Switch to the 37 unaffected states to remove the reporting break from the comparison.',
      ctrl:(S.sel?'':chip('basis',[{v:'all',l:'All areas'},{v:'unaff',l:'Unaffected 37'}],S.basis))+leg([{name:'Generation',color:'#2a78d6'},{name:'Sales',color:'#14877f'}]),id:'trend'})}
  </div>`;
  return html;
}

/* ---------------------------------------------------------------- PAGE 2 */
const SECT=[{k:'rs',name:'Residential',color:'#2a78d6'},{k:'cs',name:'Commercial',color:'#ec8b34'},{k:'is',name:'Industrial',color:'#1aa6a0'}];
function yoyOf(c,y){ const a=dv(c,y).sales, b=y>Y0?dv(c,y-1).sales:null; return pctChg(a,b); }
function yoyClass(v){ if(!nn(v)) return null; if(Math.abs(v)>40) return 'Anomaly'; if(v>=3) return 'Strong growth'; if(v<=-3) return 'Decline'; return 'Stable'; }
const YOYCOL={ 'Anomaly':'#d9a400','Strong growth':'#2a78d6','Decline':'#ec8b34','Stable':'#9fb1c8' };
function pConsumption(D){
  const L=scopeList(), a=agg(L,S.year), b=S.year>Y0?agg(L,S.year-1):null, y=S.year;
  const secSum=sumN([a.rs,a.cs,a.is]);
  const strip=`<div class="strip">
    <div><span>Sales ${y}</span><b>${fnum(a.sales,0)} TWh</b></div>
    <div><span>Year-over-year</span><b>${nn(pctChg(a.sales,b&&b.sales))?fsgn(pctChg(a.sales,b&&b.sales),1,'%'):'—'}</b></div>
    <div><span>Residential share of total sales</span><b>${nn(a.rs)?fpct(a.rs/a.sales*100,1):'—'}</b></div>
    <div><span>Residential + commercial + industrial cover</span><b>${nn(secSum)?fpct(secSum/a.sales*100,1):'—'}</b><em>of total sales</em></div>
    <div><span>Weighted retail price</span><b>${fnum(money(a.price,y),2)} ¢/kWh</b><em>${realTag()}</em></div></div>`;
  D.trend=(w,h)=>{
    const sal=series(L,x=>x.sales), yoy=sal.map((v,i)=>i? pctChg(v,sal[i-1]):null);
    const h1=Math.round(h*.62), h2=h-h1;
    const line=lineChart(w,h1,{series:[{name:'Total sales',color:'#14877f',vals:sal}],marker:y,yFmt:v=>fnum(v,0),pad:{b:4,t:10},noX:true,ticks:3,
      notes:(!S.sel)?[{year:2010,text:'reporting break'}]:[],tip:i=>`<b>${YEARS[i]}</b><div class="tr">Sales<b>${fnum(sal[i],0)} TWh</b></div><div class="tr">YoY<b>${fsgn(yoy[i],1,'%')}</b></div>`}).replace('<svg ','<svg class="s1" ');
    const vals=yoy.filter(nn), m=Math.max(5,...vals.map(Math.abs)), tk=niceTicks(-m,m,2), lo=tk[0], hi=tk[tk.length-1];
    const pad={l:48,r:14,t:10,b:24}, iw=w-pad.l-pad.r, ih=h2-pad.t-pad.b, X=i=>pad.l+i*iw/(NY-1), Y=v=>pad.t+ih-(v-lo)/(hi-lo)*ih, bw=Math.max(3,iw/NY-4);
    let g=''; tk.forEach(t=>{ g+=`<line class="gl" x1="${pad.l}" x2="${w-pad.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pad.l-6}" y="${Y(t)+3.5}" text-anchor="end">${t>0?'+':''}${t}%</text>`; });
    yoy.forEach((v,i)=>{ if(!nn(v)) return; const c=Math.abs(v)>40?'#d9a400':v>=0?'#2a78d6':'#ec8b34'; const y0=Y(0), y1=Y(v);
      g+=`<g class="hv"><rect x="${X(i)-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y1-y0))}" fill="${c}" rx="2" opacity="${YEARS[i]===y?1:.78}"/><rect class="hit" x="${X(i)-iw/NY/2}" y="${pad.t}" width="${iw/NY}" height="${ih}" data-tip="${esc(`<b>${YEARS[i]}</b><div class='tr'>Year-over-year<b>${fsgn(v,1,'%')}</b></div>`)}"/></g>`; });
    g+=xAxisYears(X,pad.t+ih,h2,pad)+`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="#9fb1c8"/>`;
    return `<div class="stk">${line}${svgWrap(w,h2,g)}</div>`;
  };
  D.sector=(w,h)=>{
    const ser=SECT.map(s=>({name:s.name,color:s.color,vals:series(L,x=>x[s.k])}));
    return stackChart(w,h,{series:ser,pct:true,marker:y,ticks:4});
  };
  /* classification of states for the selected year (percentile terciles) */
  const cm=S.consMetric; const defs={sales:{l:'Total sales',f:d=>d.sales,fmt:v=>fnum(v,0)+' TWh'},spc:{l:'Sales per capita',f:d=>d.spc,fmt:v=>fnum(v,1)+' MWh'},yoy:{l:'YoY change',f:(d,c)=>yoyOf(c,y),fmt:v=>fsgn(v,1,'%')}}[cm];
  const arr=C.map(c=>({c,v:defs.f(dv(c,y),c)})).filter(i=>nn(i.v));
  const sorted=arr.map(i=>i.v).sort((x,z)=>x-z), p33=pctl(sorted,1/3), p67=pctl(sorted,2/3);
  const cls = v => v>=p67?'High':v>=p33?'Medium':'Low';
  const counts={High:0,Medium:0,Low:0}; arr.forEach(i=>counts[cls(i.v)]++);
  const CLC={High:'#0f3a78',Medium:'#5b8fd0',Low:'#b7cdea'};
  D.rank=(w,h)=>{
    if(cm==='yoy'){
      if(y===Y0) return empty('Year-over-year needs a prior year — select 2001 or later.');
      const s=arr.slice().sort((p,q)=>q.v-p.v), items=[...s.slice(0,6),...s.slice(-6)].map(i=>{ const k=yoyClass(i.v); return {c:i.c,label:i.c,on:S.sel===i.c,sel:S.sel===i.c,value:i.v,color:YOYCOL[k],text:fsgn(i.v,1,'%'),sub:k==='Anomaly'?'anomaly':'',tip:`<b>${nm(i.c)}</b><div class="tr">YoY ${y}<b>${fsgn(i.v,1,'%')}</b></div><div class="tr">Class<b>${k}</b></div>${AFF[i.c]?'<div class="tr warnr">⚠ reporting-break state</div>':''}`}; });
      return barsH(w,h,{items,lw:34,rw:96,maxRow:24,maxBar:13});
    }
    const items=arr.slice().sort((p,q)=>q.v-p.v).slice(0,10).map(i=>{ const k=cls(i.v), fl=Math.abs(yoyOf(i.c,y)||0)>40, br=cm==='sales'&&AFF[i.c];
      return {c:i.c,label:i.c,on:S.sel===i.c,sel:S.sel===i.c,value:i.v,color:S.sel===i.c?COL.ink:CLC[k],text:defs.fmt(i.v),sub:(fl?'⚑ anomaly ':'')+(br?'⚠':''),
        tip:`<b>${nm(i.c)}</b><div class="tr">${defs.l} ${y}<b>${defs.fmt(i.v)}</b></div><div class="tr">Class<b>${k} consumption</b></div><div class="tr">YoY<b>${fsgn(yoyOf(i.c,y),1,'%')}</b></div>${br?'<div class="tr warnr">⚠ understated by reporting break</div>':''}`}; });
    return barsH(w,h,{items,lw:34,rw:118,maxRow:26,maxBar:15});
  };
  D.price=(w,h)=>{
    const lw=Math.round(w*.64);
    const ser=[{name:'Residential',short:'Residential',color:'#2a78d6',vals:series(L,(x,yy)=>money(x.rs>0&&x.rrev!==null?x.rrev/(x.rs*1e6)*100:null,yy))},
               {name:'Commercial',short:'Commercial',color:'#ec8b34',vals:series(L,(x,yy)=>money(x.cs>0&&x.crev!==null?x.crev/(x.cs*1e6)*100:null,yy))},
               {name:'Industrial',short:'Industrial',color:'#1aa6a0',vals:series(L,(x,yy)=>money(x.is>0&&x.irev!==null?x.irev/(x.is*1e6)*100:null,yy))},
               {name:'All sectors',short:'All sectors',color:'#0f2540',vals:series(L,(x,yy)=>money(x.price,yy)),dash:'4 3',width:1.6}];
    const chart=lineChart(lw,h,{series:ser,endLabels:true,marker:y,pad:{r:74},tipFmt:v=>fnum(v,2)+' ¢/kWh',yFmt:v=>fnum(v,0)});
    const st=C.map(c=>({c,v:money(dv(c,y).price,y)})).filter(i=>nn(i.v)).sort((p,q)=>q.v-p.v);
    const row=(i,n)=>`<div class="mr${S.sel===i.c?' on':''}" data-sel="${i.c}"><span>${n}</span><b>${i.c}</b><em>${fnum(i.v,1)}</em></div>`;
    const side=`<div class="mini"><h4>Highest ${y}</h4>${st.slice(0,5).map((i,k)=>row(i,k+1)).join('')}<h4>Lowest ${y}</h4>${st.slice(-5).reverse().map((i,k)=>row(i,st.length-4+k)).join('')}<p>¢/kWh, ${realTag()}</p></div>`;
    return `<div class="split">${chart}${side}</div>`;
  };
  return strip+`<div class="g2">
    ${card({title:'Sales trend and annual growth',sub:`${trendSub()} · TWh and year-over-year %`,info:'Top: total retail sales. Bottom: YoY % = (this year − last year) ÷ last year × 100, restarting for each scope. Amber bars: |change| above 40 %, treated as a likely reporting artefact rather than demand.',ctrl:leg([{name:'Growth',color:'#2a78d6'},{name:'Decline',color:'#ec8b34'},{name:'|Δ| > 40 %',color:'#d9a400'}]),id:'trend'})}
    ${card({title:'Who uses the electricity',sub:`${trendSub()} · share of residential + commercial + industrial sales`,info:'Percent of the sum of the three reported sectors. That sum is 89–100 % of total sales (transportation and other sales are not in the data), so shares are relative to the three-sector total, not to total sales.',ctrl:leg(SECT.map(s=>({name:s.name,color:s.color}))),id:'sector'})}
    ${card({title:'State consumption classes',sub:`${defs.l}, ${y} · High ≥ ${defs.fmt(p67)} · Low < ${defs.fmt(p33)}`,info:`Percentile classification of ${arr.length} areas: High = top third (≥ P67), Medium = middle third, Low = bottom third (< P33). YoY classes: IF |Δ| > 40 % THEN Anomaly, ELSEIF Δ ≥ 3 % THEN Strong growth, ELSEIF Δ ≤ −3 % THEN Decline, ELSE Stable.`,
      ctrl:chip('consMetric',[{v:'sales',l:'Total'},{v:'spc',l:'Per capita'},{v:'yoy',l:'YoY'}],cm)+(cm==='yoy'?leg(Object.keys(YOYCOL).map(k=>({name:k,color:YOYCOL[k]}))):`<div class="lg"><span class="lgi"><i style="background:${CLC.High}"></i>High ${counts.High}</span><span class="lgi"><i style="background:${CLC.Medium}"></i>Medium ${counts.Medium}</span><span class="lgi"><i style="background:${CLC.Low}"></i>Low ${counts.Low}</span></div>`),id:'rank'})}
    ${card({title:'Retail prices by sector',sub:`${trendSub()} · ¢/kWh in ${S.real?'2025 dollars (CPI-U adjusted)':'nominal dollars (not inflation-adjusted)'} · sales-weighted`,info:'Price = revenue ÷ sales × 100 for each sector, aggregated over the scope (never an average of state prices). '+(S.real?'Each year is multiplied by CPI-U(2025) ÷ CPI-U(year), so the lines show real price changes. Use the top-bar switch for nominal prices.':'Nominal dollars: part of the rise is general inflation; switch to Real in the top bar to remove it.')+' Right: states with the highest and lowest all-sector price in the selected year.',id:'price'})}
  </div>`;
}

/* ---------------------------------------------------------------- PAGE 3 */
function pGeneration(D){
  const L=scopeList(), y=S.year, yy=Math.max(y,2001), a=agg(L,yy), g0=agg(L,2001), g10=agg(L,2010);
  const GEN_OPT=[{v:'all',l:'Total'},...GROUPS.map(g=>({v:g.k,l:g.k}))];
  D.mix=(w,h)=>stackChart(w,h,{series:GROUPS.map((g,k)=>({name:g.k,color:g.color,vals:series(L,x=>x.gg[k])})),pct:S.genView==='pct',marker:y,unit:'TWh',dec:0,gapNote:'2000: no generation data'});
  const ren=series(L,x=>x.renS);
  D.ren=(w,h)=>{
    const lw=Math.round(w*.62);
    const top3=C.map(c=>({c,v:dv(c,yy).renS,g:dv(c,yy).gen})).filter(i=>nn(i.v)&&i.g>=MIN_GEN).sort((p,q)=>q.v-p.v).slice(0,3);
    const nat=series(C,x=>x.renS);
    const ser=[{name:'United States',short:'US',color:'#3f8f4f',vals:nat,width:2.4}];
    if(S.sel) ser.push({name:nm(S.sel),short:S.sel,color:'#0f2540',vals:ren,width:2.4});
    top3.forEach((i,k)=>{ if(i.c!==S.sel) ser.push({name:nm(i.c),short:i.c,color:'#9fb1c8',vals:series([i.c],x=>x.renS),width:1.4}); });
    const chart=lineChart(lw,h,{series:ser,endLabels:true,marker:y,yMin:0,yFmt:v=>v+'%',tipFmt:v=>fnum(v,1)+'%',pad:{r:44},emptyMsg:'No generation data'});
    // renewable growth in percentage points, 2001 -> selected year (states with >= 20 TWh)
    const gr=C.map(c=>({c,v:(nn(dv(c,yy).renS)&&nn(dv(c,2001).renS)&&dv(c,yy).gen>=MIN_GEN)?dv(c,yy).renS-dv(c,2001).renS:null})).filter(i=>nn(i.v)).sort((p,q)=>q.v-p.v);
    const row=(i,n,suf)=>`<div class="mr${S.sel===i.c?' on':''}" data-sel="${i.c}"><span>${n}</span><b>${i.c}</b><em>${suf}</em></div>`;
    const side=`<div class="mini"><h4>Highest share ${yy}</h4>${top3.map((i,k)=>row(i,k+1,fnum(i.v,0)+'%')).join('')}<h4>Largest gain since 2001</h4>${gr.slice(0,3).map((i,k)=>row(i,k+1,'+'+fnum(i.v,0)+' pp')).join('')}<p>states ≥ ${MIN_GEN} TWh</p></div>`;
    return `<div class="split">${chart}${side}</div>`;
  };
  D.rank=(w,h)=>{
    if(noGen()) return empty(noGen());
    const k=GROUPS.findIndex(g=>g.k===S.genSrc), col=k<0?'#2a78d6':GROUPS[k].color;
    const val=c=>{ const d=dv(c,y); return k<0?d.gen:sumN(GROUPS[k].src.map(i=>d.g[i])); };
    const arr=C.map(c=>({c,v:val(c)})).filter(i=>nn(i.v)&&i.v>0).sort((p,q)=>q.v-p.v);
    const tot=arr.reduce((s,i)=>s+i.v,0);
    const items=arr.slice(0,10).map((i,n)=>({c:i.c,label:i.c,on:S.sel===i.c,sel:S.sel===i.c,value:i.v,color:S.sel===i.c?COL.ink:col,text:fnum(i.v,i.v<10?1:0)+' TWh',sub:fnum(i.v/tot*100,0)+'% of US',tip:`<b>${nm(i.c)}</b><div class="tr">${k<0?'Generation':GROUPS[k].k} ${y}<b>${fnum(i.v,1)} TWh</b></div><div class="tr">Share of US ${k<0?'generation':GROUPS[k].k.toLowerCase()}<b>${fnum(i.v/tot*100,1)}%</b></div>`}));
    if(S.sel && !items.some(i=>i.c===S.sel)){ const n=arr.findIndex(i=>i.c===S.sel); if(n>=0) items.push({c:S.sel,label:S.sel,on:true,sel:true,value:arr[n].v,color:COL.ink,text:fnum(arr[n].v,0)+' TWh',sub:'#'+(n+1)}); }
    return barsH(w,h,{items,lw:34,rw:120,maxRow:26,maxBar:15});
  };
  const cmpBody = () => {
    if(!nn(a.gen)) return empty('No generation data');
    const tot=[g0,g10,a].map(x=>x.gen), W=1;
    const sh=(x,k)=>nn(x.gg[k])&&x.gen>0?x.gg[k]/x.gen*100:null;
    const rows=GROUPS.map((g,k)=>({g,k,s0:sh(g0,k),s1:sh(g10,k),s2:sh(a,k),d0:g0.gg[k],d2:a.gg[k]}));
    const mx=Math.max(10,...rows.flatMap(r=>[r.s0,r.s1,r.s2].filter(nn)));
    const sc=Math.ceil(mx/10)*10;
    return `<div class="cmp"><div class="ch"><span></span><span class="cx"><i>0%</i><i>${sc/2}%</i><i>${sc}%</i></span><span>Δ share</span><span>Δ TWh</span><span>Growth</span></div>${rows.map(r=>{
      const dpp=nn(r.s2)&&nn(r.s0)?r.s2-r.s0:(nn(r.s2)?r.s2:null), dtw=nn(r.d2)?(r.d2-(r.d0||0)):null, gr=nn(r.d0)&&r.d0>0&&nn(r.d2)?pctChg(r.d2,r.d0):null;
      const xs=v=>(v/sc*100)+'%';
      const dots=[[r.s0,'d0','2001'],[r.s1,'d1','2010'],[r.s2,'d2',yy]].filter(d=>nn(d[0]));
      const lo=Math.min(...dots.map(d=>d[0])), hi=Math.max(...dots.map(d=>d[0]));
      return `<div class="cr"><span class="cn"><i style="background:${r.g.color}"></i>${r.g.k}</span><span class="cx"><u></u><s style="left:${xs(lo)};width:${(hi-lo)/sc*100}%"></s>${dots.map(d=>`<b class="${d[1]}" style="left:${xs(d[0])};${d[1]==='d2'?'background:'+r.g.color+';border-color:'+r.g.color:''}" data-tip="${esc(`<b>${r.g.k}</b> ${d[2]}<br>${fnum(d[0],1)}% of generation`)}"></b>`).join('')}</span><span class="${nn(dpp)&&dpp>=0?'up':'dn'}">${fsgn(dpp,1,' pp')}</span><span>${fsgn(dtw,0)}</span><span>${nn(gr)?fsgn(gr,0,'%'):'new'}</span></div>`; }).join('')}
      <div class="cf"><span><b class="d0"></b>2001</span><span><b class="d1"></b>2010</span><span><b class="d2" style="background:#0f2540;border-color:#0f2540"></b>${yy}</span><em>Δ = ${yy} vs 2001 · pp = percentage points</em></div></div>`;
  };
  return `<div class="g3">
    ${card({title:'Generation mix, 2001–2025',sub:`${trendSub()} · ${S.genView==='pct'?'share of generation':'TWh'}`,info:'Stacked sum of the reported generation sources (Other = Bioenergy + Other fossil + Other renewables). 2000 has no generation data. Negative values (e.g. pumped-storage hydro) are floored at 0 for display only.',ctrl:chip('genView',[{v:'twh',l:'TWh'},{v:'pct',l:'Share %'}],S.genView)+leg(GROUPS.slice().reverse().map(g=>({name:g.k,color:g.color}))),id:'mix'})}
    ${card({title:'Renewable share',sub:`${trendSub()} · renewable ÷ total generation × 100`,info:'Renewable = Hydro + Wind + Solar + Bioenergy + Other renewables. Grey lines: the three highest-share states (≥ 20 TWh) in the selected year. Gain is a percentage-point difference between 2001 and the selected year, not a % growth.',ctrl:leg([{name:'United States',color:'#3f8f4f'}].concat(S.sel?[{name:nm(S.sel),color:'#0f2540'}]:[],[{name:'Top-3 states',color:'#9fb1c8'}])),id:'ren'})}
    ${card({title:'Generation by state',sub:`${GEN_OPT.find(o=>o.v===S.genSrc).l}, ${y} · top 10`,info:'Ranking of states by total generation or by one source, with each state’s share of the U.S. total for that source.',ctrl:`<select data-bind="genSrc" class="sel">${GEN_OPT.map(o=>`<option value="${o.v}"${o.v===S.genSrc?' selected':''}>${o.l}</option>`).join('')}</select>`,id:'rank'})}
    ${card({title:'How the mix changed',sub:`${trendSub()} · share of generation: 2001, 2010 and ${yy}`,info:'Dumbbell per source: share of generation in 2001, 2010 and the selected year. Δ share is in percentage points; Δ TWh and growth compare the selected year with 2001. “new” = no generation reported in 2001.',body:cmpBody()})}
  </div>`;
}

/* ---------------------------------------------------------------- PAGE 4 */
const CMP=[
  {k:'gen', l:'Electricity generation',   u:'TWh',       d:0,fn:x=>x.gen, dir:null,short:'Generation'},
  {k:'sales',l:'Electricity sales',       u:'TWh',       d:0,fn:x=>x.sales,dir:null,short:'Sales'},
  {k:'ren', l:'Renewable share',          u:'%',         d:1,fn:x=>x.renS,dir:'hi',pp:true,short:'Renewable share'},
  {k:'gpc', get l(){return S.real?'GDP per capita (real, 2017 $)':'GDP per capita (current $)';},u:'$',d:0,fn:x=>S.real?x.rgpc:x.gpc, dir:'hi',short:'GDP / capita'},
  {k:'spc', l:'Sales per capita',         u:'MWh/person',d:1,fn:x=>x.spc, dir:null,short:'Sales / capita'},
  {k:'emis',l:'Power-sector emissions',   u:'MtCO₂e',    d:0,fn:x=>x.emis,dir:'lo',short:'Emissions'},

        <text class="bv" x="${x0+a/mx*iw+5}" y="${y0-bh/2+3}">${Math.round(a/mx*100)}</text><text class="bv" x="${x0+b/mx*iw+5}" y="${y0+bh/2+5}">${Math.round(b/mx*100)}</text></g>`; });

  D.hist=(w,h)=>{

/* ---------------------------------------------------------------- PAGE 5 */
function econPts(y,excl){ const gp=d=>S.real?d.rgpc:d.gpc; return C.filter(c=>{const d=dv(c,y); return d.pop&&nn(gp(d))&&nn(d.spc)&&(!excl||!AFF[c]);}).map(c=>{const d=dv(c,y); return {c,x:gp(d),y:d.spc,pop:d.pop,sales:d.sales};}); }
function pEconomy(D){
  const y=S.year, L=scopeList();
  const pts=econPts(y,S.excl), n=pts.length, r=pearson(pts.map(p=>p.x),pts.map(p=>p.y));
  const rPop=pearson(pts.map(p=>Math.log10(p.pop)),pts.map(p=>Math.log10(p.sales)));
  const mx=median(pts.map(p=>p.x)), my=median(pts.map(p=>p.y));
  const quad=p=>(p.x>=mx?'H':'L')+(p.y>=my?'H':'L');
  const Q={HH:[],HL:[],LH:[],LL:[]}; pts.forEach(p=>Q[quad(p)].push(p));
  const reg=n>=3?ols(pts.map(p=>p.x/1000),pts.map(p=>p.y)):null;
  const strength=v=>!nn(v)?'':Math.abs(v)<.2?'very weak':Math.abs(v)<.4?'weak':Math.abs(v)<.6?'moderate':'strong';
  D.gdp=(w,h)=>{
    const ser=[{name:'Real GDP (2017 $)',short:'Real',color:'#2a78d6',vals:series(L,x=>nn(x.rgdp)?x.rgdp/1e6:null)},{name:'Nominal GDP (current $)',short:'Nominal',color:'#ec8b34',vals:series(L,x=>nn(x.cgdp)?x.cgdp/1e6:null)}];
    return lineChart(w,h,{series:ser,endLabels:true,marker:y,pad:{r:56},yFmt:v=>'$'+fnum(v,v%1?1:0)+'T',tipFmt:v=>'$'+fnum(v,2)+' trillion'});
  };
  D.pop=(w,h)=>{
    if(S.sel==='DC') return empty('No population series for DC in the dataset');
    const v=series(L,x=>nn(x.pop)?x.pop/1e6:null);
    return lineChart(w,h,{series:[{name:'Population',color:'#14877f',vals:v}],marker:y,yMin:0,yFmt:v=>v===0?'0':fnum(v,v<10?1:0)+'M',tipFmt:v=>fnum(v,2)+' million'});
  };
  D.sc=(w,h)=>{
    const lab=pts.slice().sort((p,q)=>q.y-p.y).slice(0,4).map(p=>p.c); if(S.sel) lab.push(S.sel);
    return scatterChart(w,h,{points:pts.map(p=>({c:p.c,x:p.x/1000,y:p.y,sel:S.sel===p.c,color:AFF[p.c]?'#d9a400':'#2a78d6',tip:`<b>${nm(p.c)}</b><div class="tr">${S.real?'Real GDP per capita':'GDP per capita'}<b>$${fnum(p.x,0)}</b></div><div class="tr">Sales per capita<b>${fnum(p.y,1)} MWh</b></div><div class="tr">Segment<b>${({HH:'High GDP / High use',HL:'High GDP / Low use',LH:'Low GDP / High use',LL:'Low GDP / Low use'})[quad(p)]}</b></div>${AFF[p.c]?'<div class="tr warnr">⚠ sales understated (reporting break)</div>':''}`})),
      xLabel:S.real?'Real GDP per capita (thousand 2017 $, BEA chained)':'GDP per capita (thousand current $)',yLabel:'Sales per capita (MWh)',xFmt:v=>fnum(v,0),yFmt:v=>fnum(v,0),medX:mx/1000,medY:my,reg:reg,labels:lab,
      quad:[{t:'Low GDP · High use'},{t:'High GDP · High use',right:true},{t:'Low GDP · Low use',bottom:true},{t:'High GDP · Low use',bottom:true,right:true}]});
  };
  const segName={HH:'High GDP · High use',HL:'High GDP · Low use',LH:'Low GDP · High use',LL:'Low GDP · Low use'};
  const seg=['LH','HH','LL','HL'].map(k=>`<div class="sg"><h4>${segName[k]}<b>${Q[k].length}</b></h4><div class="cl">${Q[k].sort((p,q)=>q.y-p.y).map(p=>`<span class="cp${S.sel===p.c?' on':''}${AFF[p.c]?' af':''}" data-sel="${p.c}" data-tip="${esc(`<b>${nm(p.c)}</b><br>$${fnum(p.x,0)} per person · ${fnum(p.y,1)} MWh`)}">${p.c}</span>`).join('')}</div></div>`).join('');

/* ---------------------------------------------------------------- PAGE 6 */
function pEnvironment(D){
  const y=S.year, yy=Math.max(y,2001), L=scopeList(), a=agg(L,yy), b=agg(L,2001);
  const warn=noGen();
  // counterfactual: emission factors of the selected year applied to the 2001 mix (source level)
  let cf=null, avoided=null;
  if(!warn && nn(a.gen)&&nn(b.gen)){ const ef=a.gs.map((g,i)=>g>0&&nn(a.es[i])?a.es[i]/g*1000:0), bt=b.gs.reduce((s,v)=>s+(nn(v)?v:0),0); cf=b.gs.reduce((s,v,i)=>s+((nn(v)?v:0)/bt)*ef[i],0); avoided=(cf-a.int)*a.gen/1000; }

    <div><span>Aggregate intensity ${y}</span><b>${fnum(a.int,0)} gCO₂e/kWh</b><em>emissions ÷ generation</em></div>
    <div><span>Intensity with the 2001 mix</span><b>${nn(cf)?fnum(cf,0):'—'} gCO₂e/kWh</b><em>${y} emission factors</em></div>
    <div><span>Avoided by the mix change</span><b>${nn(avoided)?fnum(avoided,0):'—'} MtCO₂e</b><em>${nn(avoided)&&cf>0?fnum(avoided/(cf*a.gen/1000)*100,0)+'% below 2001 mix':''}</em></div></div>`;
  const EG=[{k:'Coal',color:GC.Coal,idx:[0]},{k:'Gas',color:GC.Gas,idx:[1]},{k:'Other sources',color:'#7b8794',idx:[2,3,4,5,6,7,8]}];
  D.src=(w,h)=>{
    const ser=EG.map(g=>({name:g.k,color:g.color,vals:series(L,x=>sumN(g.idx.map(i=>x.es[i])))}));
    const tp=GROUPS.filter(g=>!['Coal','Gas'].includes(g.k));

    const c1=lineChart(w,h1,{series:[{name:'Total emissions',color:'#b84a4a',vals:em}],marker:y,yMin:0,pad:{b:4,t:10},noX:true,ticks:3,yFmt:v=>fnum(v,0),tipFmt:v=>fnum(v,0)+' MtCO₂e',emptyMsg:'No emissions data'}).replace('<svg ','<svg class="s1" ');
    const c2=lineChart(w,h2,{series:[{name:'Intensity',color:'#7c5cc4',vals:it}],marker:y,yMin:0,pad:{t:10},ticks:3,yFmt:v=>fnum(v,0),tipFmt:v=>fnum(v,0)+' gCO₂e/kWh',emptyMsg:'No emissions data'});
    return `<div class="stk"><div class="mt" style="color:#b84a4a">Total emissions · MtCO₂e</div>${c1}<div class="mt" style="color:#7c5cc4">Aggregate intensity · gCO₂e/kWh</div>${c2}</div>`;
  };
  const pts=C.map(c=>({c,d:dv(c,yy)})).filter(i=>nn(i.d.fosS)&&nn(i.d.int)&&i.d.gen>=MIN_GEN);
  const rr=pearson(pts.map(p=>p.d.fosS),pts.map(p=>p.d.int));
  D.sc=(w,h)=>{
    if(warn) return empty(warn);
    const lab=pts.slice().sort((p,q)=>q.d.int-p.d.int).slice(0,4).map(p=>p.c); if(S.sel) lab.push(S.sel);
    return scatterChart(w,h,{points:pts.map(p=>({c:p.c,x:p.d.fosS,y:p.d.int,sel:S.sel===p.c,color:p.d.int>600?'#b84a4a':p.d.int>350?'#ec8b34':'#2a78d6',r:Math.max(4,Math.min(10,Math.sqrt(p.d.gen)/3)),tip:`<b>${nm(p.c)}</b><div class="tr">Fossil share<b>${fnum(p.d.fosS,0)}%</b></div><div class="tr">Intensity<b>${fnum(p.d.int,0)} gCO₂e/kWh</b></div><div class="tr">Emissions<b>${fnum(p.d.emis,1)} Mt</b></div><div class="tr">Generation<b>${fnum(p.d.gen,0)} TWh</b></div>`})),
      xLabel:'Fossil share of generation (%)',yLabel:'Intensity (gCO₂e/kWh)',xFmt:v=>fnum(v,0)+'%',yFmt:v=>fnum(v,0),labels:lab,reg:pts.length>=3?ols(pts.map(p=>p.d.fosS),pts.map(p=>p.d.int)):null,pad:{b:34}});

  D.rank=(w,h)=>{

      return barsH(w,h,{items:arr.map(p=>({c:p.c,label:p.c,on:S.sel===p.c,sel:S.sel===p.c,value:p.d.int,color:S.sel===p.c?COL.ink:'#b84a4a',text:fnum(p.d.int,0),sub:'g/kWh',tip:`<b>${nm(p.c)}</b><div class="tr">Intensity ${yy}<b>${fnum(p.d.int,0)} gCO₂e/kWh</b></div><div class="tr">Generation<b>${fnum(p.d.gen,0)} TWh</b></div>`})),lw:34,rw:80,maxRow:26,maxBar:15});

/* ---------------------------------------------------------------- PAGE 7 */
const DQ=(()=>{
  const n=C.length, ny=NY;
  const anyG=(c,i)=>{ for(let k=0;k<9;k++) if(nn(F['g'+k][c][i])) return true; return false; };
  const anyE=(c,i)=>{ for(let k=0;k<9;k++) if(nn(F['e'+k][c][i])) return true; return false; };
  const groups=[
    {k:'Sales & revenue',f:(c,i)=>nn(F.ts[c][i])&&nn(F.rev[c][i])},
    {k:'Retail prices',f:(c,i)=>nn(F.pt[c][i])},
    {k:'Customers',f:(c,i)=>nn(F.cust[c][i])},
    {k:'Population',f:(c,i)=>nn(F.pop[c][i])},
    {k:'GDP real / nominal',f:(c,i)=>nn(F.rgdp[c][i])&&nn(F.cgdp[c][i])},
    {k:'GDP per capita',f:(c,i)=>nn(F.gpc[c][i])},
    {k:'Generation',f:anyG},{k:'Emissions',f:anyE}];
  groups.forEach(g=>{ g.cnt=YEARS.map((_,i)=>{let s=0; for(let c=0;c<n;c++) if(g.f(c,i)) s++; return s;}); g.tot=g.cnt.reduce((a,b)=>a+b,0); });
  const miss=[['Sales, revenue, price, customers',['ts','rev','pt','cust']],['Population',['pop']],['Real and nominal GDP',['rgdp','cgdp']],['GDP per capita',['gpc']]].map(([l,fs])=>{ let m=0; fs.forEach(f=>{ let k=0; for(let c=0;c<n;c++) for(let i=0;i<ny;i++) if(!nn(F[f][c][i])) k++; m=Math.max(m,k); }); return {l,m}; });
  miss.push({l:'Generation (any source)',m:n*ny-groups[6].tot}); miss.push({l:'Emissions (any source)',m:n*ny-groups[7].tot});
  let pos=0,zero=0,blank=0,neg=0,unavail=0;
  for(let k=0;k<9;k++) for(let c=0;c<n;c++) for(let i=0;i<ny;i++){ const v=F['g'+k][c][i]; if(!anyG(c,i)){ unavail++; continue; } if(!nn(v)) blank++; else if(v===0) zero++; else if(v<0) neg++; else pos++; }
  // national validation: US aggregate row vs sum of the 51 areas
  const chk=[['Sales (TWh)','ts',v=>v*1e6,'ts',1e6],['Revenue ($ bn)','rev',v=>v,'rev',1e6],['Customers (M)','cust',v=>v,'cust',1e6],['Real GDP ($ tn)','rgdp',v=>v,'rgdp',1e6],['Nominal GDP ($ tn)','cgdp',v=>v,'cgdp',1e6]].map(([l,f,t,u,dv_])=>{
    let mxd=0; const at={}; YEARS.forEach((yr,i)=>{ let s=0; for(let c=0;c<n;c++) if(nn(F[f][c][i])) s+=F[f][c][i]; const us=P.US[u][i], d=Math.abs((t(s)-us)/us*100); mxd=Math.max(mxd,d); at[yr]={sum:t(s)/dv_,us:us/dv_,d:(t(s)-us)/us*100}; });
    return {l,mxd,at}; });
  return {groups,miss,pos,zero,blank,neg,unavail,chk,cells:9*n*ny};
})();

function pMethod(D){
  const y=S.year, tot=C.length*NY;
  const tiles=[
    ['26','years, 2000–2025'],[`${C.length}`,`areas: 50 states + DC (+ 1 US total row)`],[fnum(P.dq.rows),`rows × ${P.dq.cols} columns in the CSV`],
    [fnum(P.dq.dups),'duplicate year + state keys'],[fnum(DQ.chk[0].mxd,2)+'%','max gap, US row vs sum of states (sales)'],[`${AFF_LIST.length}`,`areas with sales ratio < ${BREAK_RATIO.toFixed(2)}`]
  ].map(t=>`<div class="tile"><b>${t[0]}</b><span>${t[1]}</span></div>`).join('');
  D.cov=(w,h)=>{
    const lw=114, rw=52, top=2, rh=(h-top-18)/DQ.groups.length, cw=(w-lw-rw)/NY; let g='';
    DQ.groups.forEach((gr,r)=>{ g+=`<text class="bl" x="${lw-8}" y="${top+r*rh+rh/2+4}" text-anchor="end">${gr.k}</text>`;
      gr.cnt.forEach((c,i)=>{ const p=c/C.length; g+=`<rect x="${lw+i*cw}" y="${top+r*rh}" width="${cw-1.5}" height="${rh-2}" rx="2" fill="${p===0?'#f2e3e3':rampColor(RAMPS.gen,0.15+p*0.85)}" data-tip="${esc(`<b>${gr.k} · ${YEARS[i]}</b><br>${c} of ${C.length} areas have data (${fnum(p*100,0)}%)`)}"/>`; });
      g+=`<text class="bv" x="${w-rw+6}" y="${top+r*rh+rh/2+4}">${fnum(gr.tot/tot*100,1)}%</text>`; });
    for(let i=0;i<NY;i+=5) g+=`<text class="ax" x="${lw+i*cw+cw/2}" y="${h-4}" text-anchor="middle">${YEARS[i]}</text>`;
    g+=`<text class="ax" x="${lw+(NY-1)*cw+cw/2}" y="${h-4}" text-anchor="middle">${YEARS[NY-1]}</text>`;
    return svgWrap(w,h,g);
  };
  const missRows=DQ.miss.map(r=>{ const p=r.m/tot*100; const st=r.m===0?['Complete','ok']:r.l==='Population'||r.l==='GDP per capita'?['N/A (DC)','na']:r.l.startsWith('Gen')||r.l.startsWith('Emis')?['Year 2000','un']:['Partial','pa'];
    return `<tr><td>${r.l}</td><td>${fnum(r.m)}</td><td>${fnum(p,1)}%</td><td><span class="bd ${st[1]}">${st[0]}</span></td></tr>`; }).join('');
  const cells=DQ.cells, part=(v,c,l)=>`<span class="lgi"><i style="background:${c}"></i>${l} <b>${fnum(v)}</b></span>`;
  const bar=[[DQ.pos,'#2a78d6'],[DQ.zero,'#9fb1c8'],[DQ.blank,'#e6c36a'],[DQ.neg,'#ec8b34'],[DQ.unavail,'#e9c9c9']].map(([v,c])=>`<i style="width:${v/cells*100}%;background:${c}"></i>`).join('');
  const covBody=`<div class="plot" data-draw="cov"></div>`;
  const missBody=`<table class="tbl sm"><thead><tr><th>Variable</th><th>Missing</th><th>Share</th><th>Type</th></tr></thead><tbody>${missRows}</tbody></table>
    <div class="zx"><h4>Generation source cells (9 sources × ${tot} state-years = ${fnum(cells)})</h4><div class="zb">${bar}</div><div class="lg wrap">${part(DQ.pos,'#2a78d6','Reported > 0')}${part(DQ.zero,'#9fb1c8','True zero')}${part(DQ.blank,'#e6c36a','Blank (source not reported)')}${part(DQ.neg,'#ec8b34','Negative (net)')}${part(DQ.unavail,'#e9c9c9','Unavailable year')}</div></div>`;
  // affected vs unaffected
  const a09=agg(AFF_LIST,2009), a25=agg(AFF_LIST,2025), u09=agg(UNAFF_LIST,2009), u25=agg(UNAFF_LIST,2025), n09=agg(C,2009), n25=agg(C,2025);
  D.aff=(w,h)=>{
    const idx=(list)=>{ const s=series(list,x=>x.sales), b=s[2009-Y0]; return s.map(v=>v/b*100); };
    const h1=Math.floor((h-40)/2), h2=h-40-h1;
    const c1=lineChart(w,h1,{series:[{name:'Affected',short:`Affected ${AFF_LIST.length}`,color:'#d9a400',vals:idx(AFF_LIST)},{name:'Unaffected',short:`Unaff. ${UNAFF_LIST.length}`,color:'#2a78d6',vals:idx(UNAFF_LIST)}],endLabels:true,pad:{r:88,b:4,t:10},noX:true,ticks:3,yFmt:v=>fnum(v,0),notes:[{year:2010,text:'break'}],yMin:0,tipFmt:v=>fnum(v,0)}).replace('<svg ','<svg class="s1" ');
    const c2=lineChart(w,h2,{series:[{name:'Affected',short:'Affected',color:'#d9a400',vals:series(AFF_LIST,x=>x.sGen)},{name:'Unaffected',short:'Unaffected',color:'#2a78d6',vals:series(UNAFF_LIST,x=>x.sGen)}],endLabels:true,pad:{r:88,t:10},ticks:3,yMin:0,yMax:110,yFmt:v=>v+'%',tipFmt:v=>fnum(v,0)+'%'});
    return `<div class="stk"><div class="mt">Retail sales, index 2009 = 100</div>${c1}<div class="mt">Sales ÷ generation (%)</div>${c2}</div>`;
  };
  const chg=(x,z)=>fsgn(pctChg(z,x),0,'%');
  const ordered=AFF_LIST.slice().sort((p,q)=>RATIO[p]-RATIO[q]);
  const affBody=`<div class="plot" data-draw="aff"></div>
    <div class="af-stats">
      <div><span>Affected (${AFF_LIST.length})</span><b>${fnum(a09.sales,0)} → ${fnum(a25.sales,0)} TWh</b><em>${chg(a09.sales,a25.sales)}</em></div>
      <div><span>Unaffected (${UNAFF_LIST.length})</span><b>${fnum(u09.sales,0)} → ${fnum(u25.sales,0)} TWh</b><em>${chg(u09.sales,u25.sales)}</em></div>
      <div><span>National</span><b>${fnum(n09.sales,0)} → ${fnum(n25.sales,0)} TWh</b><em>${chg(n09.sales,n25.sales)}</em></div>
      <div class="wide"><span>Sales ÷ generation, 2009 → 2025</span><b>affected ${fnum(a09.sGen,0)}% → ${fnum(a25.sGen,0)}% · unaffected ${fnum(u09.sGen,0)}% → ${fnum(u25.sGen,0)}%</b></div></div>
    <p class="note">Rule: sales 2025 ÷ sales 2009 &lt; ${BREAK_RATIO.toFixed(2)}, fixed on the full data (the year selector never changes it). The ${AFF_LIST.length} affected areas lose ${fnum(a09.sales-a25.sales,0)} TWh while the other ${UNAFF_LIST.length} gain ${fnum(u25.sales-u09.sales,0)} TWh — the break, not weaker demand, hides the national growth.</p>
    <div class="cl">${ordered.map(c=>`<span class="cp af" data-tip="${esc(`<b>${nm(c)}</b><br>2025 ÷ 2009 sales = ${fnum(RATIO[c],2)}`)}">${c} ${fnum(RATIO[c],2)}</span>`).join('')}</div>`;
  const vrows=DQ.chk.map(r=>{ const a=r.at[y]; return `<tr><td>${r.l}</td><td>${fnum(a.sum,2)}</td><td>${fnum(a.us,2)}</td><td>${fsgn(a.d,2,'%')}</td><td>${fnum(r.mxd,2)}%</td></tr>`; }).join('');
  const valBody=`<table class="tbl sm"><thead><tr><th>${y}</th><th>States</th><th>US row</th><th>Gap</th><th>Max</th></tr></thead><tbody>${vrows}</tbody></table><p class="note">US row = validation only, never added to state sums. GDP differs by up to ${fnum(Math.max(DQ.chk[3].mxd,DQ.chk[4].mxd),1)}% (not allocated to states).</p>`;
  const methBody=`<div class="meth">
    <h4>Sources</h4><p><b>EIA</b> sales, revenue, prices, customers · <b>Ember</b> generation and emissions · <b>BEA</b> state GDP (real 2017 $, current $) · <b>FRED</b> population, web-scraped (original provider: U.S. Census Bureau) · <b>BLS CPI-U</b> (all items, annual average) to deflate prices to 2025 $; 2025 = mean of 11 published months (Oct 2025 not released).</p>
    <h4>Geography</h4><p>50 states + DC. Puerto Rico is not in the file. DC has no population or GDP per capita. The US row is for validation only.</p>
    <h4>Definitions</h4><p><b>Price</b> = revenue ÷ sales × 100 (¢/kWh); real = × CPI(2025) ÷ CPI(year). <b>Intensity</b> = Mt ÷ TWh × 1000. <b>Renewable</b> = hydro, wind, solar, bio, other renewables. <b>GDP/capita</b> = GDP ÷ population (nominal field, or BEA real 2017 $ in Real mode). Blank source cells are not imputed.</p>
    <h4>Caution</h4><p>Generation − sales is an accounting gap (losses, own use, trade), not a surplus. Correlation is not causation.</p></div>`;
  return `<div class="tiles">${tiles}</div>
  <div class="g7">
    <div class="col"><div class="r1">${card({title:'Data coverage overview',sub:'Share of the 51 areas with a value, by variable group and year',info:'Each cell = how many of the 51 areas have data for that variable group in that year. Pale red = no data in the source for that year; the right-hand figure is overall coverage.',body:covBody})}</div><div class="r2">${card({title:'Missing values and zeros',sub:`Out of ${fnum(tot)} state-years · kept apart, never set to zero`,info:'Nothing is replaced by zero. A reported 0 is a true zero; a blank cell means the source reported nothing for that state-year; 2000 has no generation or emissions at all; DC has no population.',body:missBody})}</div></div>
    ${card({cls:'c-aff',title:'Sales reporting discontinuity',sub:'Affected vs. unaffected areas',info:'14 areas report far lower retail sales after 2009, while their generation does not fall — consistent with a change in how sales are reported, not real demand. The classification is fixed (2025 ÷ 2009 < 0.70) and independent of the year selector.',body:affBody})}
    <div class="col"><div class="r3">${card({title:'National aggregation check',sub:'Sum of 51 areas vs the US row',info:'The US aggregate row is compared with the sum of state-level records to test integrity; it is excluded from all state sums.',body:valBody})}</div><div class="r4">${card({title:'Methodology and sources',sub:'Definitions applied on every page',body:methBody})}</div></div>
  </div>`;
}

/* ---------------------------------------------------------------- shell */
const ICON={
  overview:'<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  consumption:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  generation:'<circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>',
  compare:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  economy:'<path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/>',
  environment:'<path d="M12 2c4 4 6 7 6 11a6 6 0 0 1-12 0c0-4 2-7 6-11z"/>',
  method:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>'
};
const PAGES=[
  {id:'overview',t:'Executive Overview',s:'How the U.S. generates, sells and prices electricity, state by state',f:pOverview},
  {id:'consumption',t:'Electricity Consumption',s:'Demand side: sector mix, growth, consumption classes and prices',f:pConsumption},
  {id:'generation',t:'Electricity Generation',s:'Supply side: how the generation mix and renewable share evolved',f:pGeneration},
  {id:'compare',t:'State Comparison',s:'Put any two states side by side and rank all states on one indicator',f:pCompare},
  {id:'economy',t:'Economy & Population',s:'Is electricity use linked to income and population? Evidence and limits',f:pEconomy},
  {id:'environment',t:'Environmental Impact',s:'Greenhouse-gas emissions of the power sector and what drives them',f:pEnvironment},
  {id:'method',t:'Methodology & Data Quality',s:'Coverage, missing values, validation and the sales reporting discontinuity',f:pMethod}
];
const $ = (s,r=document)=>r.querySelector(s);
function buildShell(){
  $('#nav').innerHTML=PAGES.map((p,i)=>`<button class="nv" data-page="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[p.id]}</svg><span>${p.t}</span></button>`).join('');
}
function renderTop(){
  const pg=PAGES.find(p=>p.id===S.page);
  $('#title').textContent=pg.t; $('#sub').textContent=pg.s;
  document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.page===S.page));
  $('#yr').textContent=S.year; $('#yrng').value=S.year;
  const showState = !['compare','method'].includes(S.page);
  $('#realBox').style.display=['overview','consumption','economy','compare'].includes(S.page)?'flex':'none';
  document.querySelectorAll('#realBox .chip').forEach(b=>b.classList.toggle('on',String(S.real)===b.dataset.v));
  $('#stateBox').style.display=showState?'flex':'none';
  $('#stateSel').value=S.sel||'';
  $('#reset').style.display=S.sel?'inline-flex':'none';
}
function render(){
  const pg=PAGES.find(p=>p.id===S.page), D={}, host=$('#page');
  host.className='page pg-'+S.page;
  host.innerHTML=pg.f(D);
  host.querySelectorAll('.plot[data-draw]').forEach(el=>{
    const fn=D[el.dataset.draw]; if(!fn) return;
    const w=Math.floor(el.clientWidth), h=Math.floor(el.clientHeight);
    try{ el.innerHTML=fn(w,h); }catch(err){ el.innerHTML=empty('Chart error: '+err.message); console.error(err); }
  });
  renderTop();
}
/* ---------- tooltip ---------- */
let tipEl, appEl;
function showTip(e){
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){ tipEl.style.display='none'; return; }
  tipEl.innerHTML=t.getAttribute('data-tip'); tipEl.style.display='block';
  const r=appEl.getBoundingClientRect(), s=r.width/1366, mx=(e.clientX-r.left)/s, my=(e.clientY-r.top)/s;
  const tw=tipEl.offsetWidth, th=tipEl.offsetHeight;
  let x=mx+14, yy=my+14; if(x+tw>1360) x=mx-tw-14; if(yy+th>762) yy=my-th-12; if(yy<4) yy=4;
  tipEl.style.left=Math.max(4,x)+'px'; tipEl.style.top=yy+'px';
}
function fit(){ const s=Math.min(innerWidth/1366, innerHeight/768); appEl.style.transform=`translate(${(innerWidth-1366*s)/2}px,${(innerHeight-768*s)/2}px) scale(${s})`; }
function toVal(v){ return v==='true'?true:v==='false'?false:v; }
function init(){
  appEl=$('#app'); tipEl=$('#tip'); buildShell();
  $('#stateSel').innerHTML='<option value="">All states</option>'+stateOpts('');
  fit(); addEventListener('resize',fit);
  document.addEventListener('mousemove',showTip); document.addEventListener('mouseover',showTip);
  document.addEventListener('mouseleave',()=>tipEl.style.display='none');
  document.addEventListener('click',e=>{
    const pgb=e.target.closest('[data-page]'); if(pgb){ S.page=pgb.dataset.page; render(); return; }
    const st=e.target.closest('[data-set]'); if(st){ S[st.dataset.set]=toVal(st.dataset.v); render(); return; }
    const sl=e.target.closest('[data-sel]'); if(sl && S.page!=='compare'){ const c=sl.dataset.sel; S.sel=(S.sel===c)?null:c; tipEl.style.display='none'; render(); return; }
    if(e.target.closest('#reset')){ S.sel=null; render(); return; }
    const yb=e.target.closest('[data-yr]'); if(yb){ S.year=clamp(S.year+Number(yb.dataset.yr),Y0,YN); render(); }
  });
  document.addEventListener('change',e=>{ const b=e.target.closest('[data-bind]'); if(b){ S[b.dataset.bind]=toVal(b.value); render(); } if(e.target.id==='stateSel'){ S.sel=e.target.value||null; render(); } });
  $('#yrng').addEventListener('input',e=>{ S.year=Number(e.target.value); render(); });
  render();
}
window.__S=S; window.__render=render; window.__AGG=agg; window.__DV=dv; window.__AFF=AFF_LIST; window.__DQ=DQ;
init();
})();
</script>
